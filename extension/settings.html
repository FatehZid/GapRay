<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GapRay Settings</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="page">
    <header class="head">
      <h1>GapRay</h1>
      <span class="muted" id="version"></span>
    </header>
    <h2>Keyboard shortcut</h2>
    <div class="card">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
      <span class="grow">Turn GapRay on or off</span>
      <kbd id="shortcut">Not set</kbd>
      <button class="btn" id="change">Change</button>
    </div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
