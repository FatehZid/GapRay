name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Formatting
        run: npx --yes prettier@3 --check .
      - name: JavaScript syntax
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Manifest
        run: python3 -m json.tool extension/manifest.json > /dev/null
